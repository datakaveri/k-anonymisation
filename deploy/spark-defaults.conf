# Spark settings baked into the image (copied to $SPARK_HOME/conf). They are the hardening review items
# R1 and R2 and must hold for every job; the SparkApplication only adds sizing.

# R1: driver and executors authenticate each other, and RPC and block transfers are encrypted. The secret
# is NOT in the pod spec: an init step (python -m anamika_spark.initsecret) fetches it from KBS into a
# memory-backed emptyDir. (Kubernetes also reads the driver/executor-specific variants of this setting;
# the same file is used for both.)
spark.authenticate                      true
spark.authenticate.secret.file          /run/anamika/spark-secret
spark.network.crypto.enabled            true
spark.network.crypto.keyLength          256

# Spill, shuffle, cached blocks and broadcasts (which carry the column keys and token vaults) are
# encrypted with an ephemeral per-application key.
spark.io.encryption.enabled             true
spark.io.encryption.keySizeBits         256

# R2: nothing that shows task or row detail leaves the VM. No web UI, no event log, no history, no
# driver log upload.
spark.ui.enabled                        false
spark.ui.showConsoleProgress            false
spark.eventLog.enabled                  false
spark.driver.log.persistToDfs.enabled   false

# Local dirs on tmpfs (RAM inside the confidential guest, so never in clear on a disk the host can read):
# on Kubernetes spark.kubernetes.local.dirs.tmpfs makes the Operator mount memory-backed volumes and point
# Spark at them. If a job outgrows RAM, mount an encrypted data disk and set SPARK_LOCAL_DIRS to it instead.
# (Local mode takes ANAMIKA_LOCAL_DIR; see run.py.)
spark.kubernetes.local.dirs.tmpfs       true

# One Python process per core reused across tasks: engine caches (NER) and skald_core stay warm.
spark.python.worker.reuse               true
spark.sql.shuffle.partitions            8
spark.kubernetes.driver.deleteOnTermination true
