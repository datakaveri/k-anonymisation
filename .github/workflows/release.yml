name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Tag must equal the version in SKALD/Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' SKALD/Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  binary:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the static binary
        working-directory: SKALD
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="skald_pipeline-${VERSION}-x86_64-unknown-linux-musl"
          mkdir "$name"
          cp SKALD/target/x86_64-unknown-linux-musl/release/skald_pipeline LICENSE README.md CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="skald_pipeline-${VERSION}-x86_64-unknown-linux-musl"
          gh release create "${GITHUB_REF_NAME}" "$name.tar.gz" "$name.tar.gz.sha256" \
            --title "SKALD ${VERSION}" --notes-file CHANGELOG.md --verify-tag

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/datakaveri/skald:${{ needs.version.outputs.version }}
            ghcr.io/datakaveri/skald:v${{ needs.version.outputs.version }}
