[package]
name = "skald_core"
version = "4.2.0"
edition = "2024"
rust-version = "1.92"
description = "Python bindings for SKALD's batch API: Arrow record batches in and out"
license = "Apache-2.0"
publish = false

# A separate crate, not a workspace member: the SKALD crate (CLI, Dockerfile,
# CI, static musl build) stays exactly as it was and never sees PyO3. This
# crate depends on it by path with the `arrow` feature on.
[lib]
name = "skald_core"
crate-type = ["cdylib"]

[dependencies]
skald_ola2 = { path = "..", features = ["arrow"] }
arrow-array = "60.2.0"
arrow-pyarrow = "60.2.0"
pyo3 = { version = "0.29", features = ["extension-module"] }
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order"] }

[profile.release]
# Integer overflow in bin and lattice arithmetic must stop the run, not wrap.
overflow-checks = true
